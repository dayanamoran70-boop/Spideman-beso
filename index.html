<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un beso arácnido para ti 🕷️❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Telaraña en forma de corazón */
        .contenedor-corazon {
            position: relative;
            width: 280px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .telarana-corazon {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
            animation: latidoCorazon 2s infinite ease-in-out 2.5s;
        }

        .linea-corazon {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dibujarTelarana 2.2s ease-out forwards 1.1s;
        }

        .hilos-internos {
            opacity: 0;
            animation: aparecerHilos 1s ease-in forwards 2.2s;
        }

        @keyframes dibujarTelarana {
            to { stroke-dashoffset: 0; }
        }

        @keyframes aparecerHilos {
            to { opacity: 0.85; }
        }

        @keyframes latidoCorazon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        /* Spider-Man entrando desde la derecha */
        .spiderman-caja {
            position: fixed;
            right: -250px;
            top: 22%;
            width: 210px;
            height: 210px;
            z-index: 5;
            cursor: pointer;
            animation: entrarDerecha 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes entrarDerecha {
            0% { right: -250px; transform: rotate(25deg); }
            70% { right: 15px; transform: rotate(-5deg); }
            100% { right: -5px; transform: rotate(0deg); }
        }

        /* Hilo de telaraña que dispara hacia el corazón */
        .disparo-hilo {
            position: fixed;
            top: 38%;
            right: 165px;
            height: 3px;
            background: linear-gradient(90deg, rgba(255,255,255,0.2), #ffffff);
            box-shadow: 0 0 8px #fff;
            transform-origin: right center;
            transform: rotate(-8deg);
            width: 0;
            z-index: 4;
            animation: dispararHilo 0.5s ease-out forwards 1s;
        }

        @keyframes dispararHilo {
            0% { width: 0; opacity: 1; }
            80% { width: 140px; opacity: 1; }
            100% { width: 0; opacity: 0; }
        }

        /* Besos flotando */
        .beso-flotante {
            position: fixed;
            font-size: 28px;
            pointer-events: none;
            z-index: 10;
            animation: volarBeso 2.2s ease-out forwards;
        }

        @keyframes volarBeso {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            50% { transform: translate(-90px, -40px) scale(1.2) rotate(-15deg); opacity: 1; }
            100% { transform: translate(-190px, -100px) scale(1.5) rotate(15deg); opacity: 0; }
        }

        /* Mensaje inferior */
        .tarjeta-mensaje {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 77, 77, 0.6);
            padding: 15px 25px;
            border-radius: 18px;
            text-align: center;
            color: #fff;
            z-index: 6;
            max-width: 80%;
            opacity: 0;
            animation: subirMensaje 1s ease forwards 2.5s;
        }

        @keyframes subirMensaje {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tarjeta-mensaje h2 {
            margin: 0 0 6px 0;
            color: #ff4d4d;
            font-size: 20px;
        }

        .tarjeta-mensaje p {
            margin: 0;
            font-size: 14px;
            color: #e0e0e0;
        }
    </style>
</head>
<body>

    <!-- Corazón de telaraña -->
    <div class="contenedor-corazon">
        <svg class="telarana-corazon" viewBox="0 0 200 185">
            <!-- Contorno principal del corazón -->
            <path class="linea-corazon" d="M100,170 C100,170 15,115 15,58 C15,28 38,10 64,10 C82,10 95,22 100,34 C105,22 118,10 136,10 C162,10 185,28 185,58 C185,115 100,170 100,170 Z" 
                  fill="rgba(255, 77, 77, 0.15)" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
            
            <!-- Hilos internos de la telaraña -->
            <g class="hilos-internos" stroke="#ffffff" stroke-width="1.5" fill="none">
                <line x1="100" y1="85" x2="100" y2="34" />
                <line x1="100" y1="85" x2="100" y2="170" />
                <line x1="100" y1="85" x2="35" y2="25" />
                <line x1="100" y1="85" x2="165" y2="25" />
                <line x1="100" y1="85" x2="15" y2="65" />
                <line x1="100" y1="85" x2="185" y2="65" />
                <line x1="100" y1="85" x2="45" y2="125" />
                <line x1="100" y1="85" x2="155" y2="125" />
                <!-- Anillos de telaraña -->
                <path d="M100,62 Q82,52 68,60 Q58,72 62,88 Q75,108 100,122 Q125,108 138,88 Q142,72 132,60 Q118,52 100,62 Z" />
                <path d="M100,45 Q70,30 45,45 Q32,68 40,95 Q65,130 100,148 Q135,130 160,95 Q168,68 155,45 Q130,30 100,45 Z" />
            </g>
        </svg>
    </div>

    <!-- Hilo disparado -->
    <div class="disparo-hilo"></div>

    <!-- Spider-Man apareciendo por la derecha -->
    <div class="spiderman-caja" onclick="lanzarBeso()">
        <svg viewBox="0 0 200 200">
            <!-- Hilo del que cuelga/se sostiene -->
            <line x1="140" y1="0" x2="120" y2="50" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
            <!-- Cuerpo / Hombro -->
            <path d="M110,130 Q150,115 195,140 L195,200 L100,200 Z" fill="#e60000" />
            <path d="M125,135 Q150,145 160,200 L115,200 Z" fill="#0044cc" />
            <!-- Cabeza de Spider-Man -->
            <ellipse cx="110" cy="85" rx="42" ry="50" transform="rotate(-12 110 85)" fill="#e60000" stroke="#990000" stroke-width="2" />
            <!-- Líneas de telaraña en la máscara -->
            <g stroke="#1a1a1a" stroke-width="1.2" opacity="0.45" fill="none">
                <line x1="105" y1="85" x2="100" y2="36" />
                <line x1="105" y1="85" x2="72" y2="55" />
                <line x1="105" y1="85" x2="140" y2="50" />
                <line x1="105" y1="85" x2="70" y2="95" />
                <line x1="105" y1="85" x2="148" y2="95" />
                <line x1="105" y1="85" x2="115" y2="134" />
                <circle cx="105" cy="85" r="18" />
                <circle cx="105" cy="85" r="32" />
            </g>
            <!-- Ojo izquierdo (guiñando feliz) -->
            <path d="M76,75 Q88,65 98,78" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" />
            <path d="M76,75 Q88,65 98,78" stroke="#111111" stroke-width="2" fill="none" stroke-linecap="round" />
            <!-- Ojo derecho blanco clásico -->
            <path d="M112,76 Q128,55 142,65 Q138,88 112,76 Z" fill="#ffffff" stroke="#111111" stroke-width="3.5" />
            <!-- Mano lanzando telaraña / beso -->
            <g transform="translate(52, 108) rotate(-15)">
                <rect x="10" y="10" width="26" height="24" rx="10" fill="#e60000" />
                <!-- Dedos postura Spider-Man -->
                <rect x="0" y="2" width="7" height="18" rx="3.5" fill="#e60000" />
                <rect x="28" y="0" width="7" height="18" rx="3.5" fill="#e60000" />
                <rect x="9" y="12" width="16" height="10" rx="4" fill="#b30000" />
            </g>
        </svg>
    </div>

    <!-- Mensaje debajo del corazón -->
    <div class="tarjeta-mensaje">
        <h2>¡Atrapado en mi telaraña! 🕷️❤️</h2>
        <p>Te mando un beso gigante. Toca a Spider-Man para mandarte más 😘</p>
    </div>

    <script>
        function lanzarBeso() {
            const beso = document.createElement('div');
            beso.classList.add('beso-flotante');
            const emojis = ['😘', '❤️', '💋', '🕷️', '💖'];
            beso.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Posición cerca de la máscara de Spider-Man a la derecha
            beso.style.right = '135px';
            beso.style.top = (26 + Math.random() * 10) + '%';
            document.body.appendChild(beso);

            setTimeout(() => {
                beso.remove();
            }, 2200);
        }

        // Empezar a tirar besos automáticos después de que dispara la telaraña
        setTimeout(() => {
            lanzarBeso();
            setInterval(lanzarBeso, 1500);
        }, 1800);
    </script>

</body>
</html>
